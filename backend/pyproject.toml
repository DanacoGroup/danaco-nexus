[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "danaco-nexus"
version = "0.1.0"
description = "Danaco Nexus - Personal AI Workspace for Documents, Images and Automation"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "faster-whisper>=1.2,<2",
    "piper-tts>=1.3,<2",
    "redis>=5.2,<8",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "asyncpg>=0.31,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.12,<3",
    "argon2-cffi>=25.1,<26",
    "python-multipart>=0.0.20",
    "httpx>=0.28,<1",
    "pymupdf>=1.28,<1.29",
    "pikepdf>=10.13,<11",
    "reportlab>=5.0,<6",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "pillow>=12.3,<13",
    "opencv-python-headless>=4.12,<5",
    "numpy>=2.3,<3",
    "qdrant-client>=1.19,<2",
    "fastembed>=0.8,<1",
    "pywebpush>=2.0,<3",
    "icalendar>=6.3,<8",
    "segno>=1.6,<2",
]

[project.optional-dependencies]
test = ["pytest>=9", "pytest-asyncio>=1.4", "aiosqlite>=0.21", "ruff>=0.15"]

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: Depends/File/Form w wartościach domyślnych to idiom FastAPI.
# UP042: enum dziedziczący po str zachowuje zgodność serializacji JSON.
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["tools: test wymaga programów narzędziowych (LibreOffice, FFmpeg, unpaper, ImageMagick)"]

# --- moduł agenci ---
# Instrukcje trybów rozmów (nexus/agent/tryby/<tryb>.md) w instalacji nieedytowalnej.
[tool.setuptools.package-data]
"nexus.agent" = ["tryby/*.md"]
"nexus.demo" = ["przyklady/*", "przyklady/nagrania/*.json", "przyklady/nagrania/pliki/**/*"]
