; Ustawienia PHP dla Nextcloud (FrankenPHP, chmura osobista Danaco Nexus).
memory_limit = 1G
upload_max_filesize = 20G
post_max_size = 20G
max_execution_time = 3600
max_input_time = 3600
output_buffering = Off
default_charset = "UTF-8"
date.timezone = Europe/Warsaw
sys_temp_dir = /danaco/projekty/danaco-nexus/dane/tmp
upload_tmp_dir = /danaco/projekty/danaco-nexus/dane/tmp

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.jit = 0

apc.enable_cli = 1
apc.shm_size = 128M
