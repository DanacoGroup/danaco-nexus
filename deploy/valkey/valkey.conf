# Valkey (zgodny z Redis) projektu Danaco Nexus.
# Tylko gniazdo uniksowe (bez TCP). Zastosowania:
#   - Nexus: powiadomienia o zdarzeniach zadań (strumień SSE bez odpytywania bazy),
#   - Nextcloud: pamięć podręczna rozproszona i blokady plików.
# Dane są odtwarzalne, więc bez zapisu na dysk.
port 0
unixsocket /danaco/projekty/danaco-nexus/dane/run/valkey.sock
unixsocketperm 770
dir /danaco/projekty/danaco-nexus/dane/valkey
daemonize no
supervised systemd
loglevel notice
logfile ""
databases 4
save ""
appendonly no
maxmemory 768mb
maxmemory-policy volatile-lru
timeout 0
tcp-keepalive 0
