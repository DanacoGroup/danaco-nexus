# Uwierzytelnianie klastra PostgreSQL projektu Danaco Nexus (tylko gniazdo uniksowe).
# Plik wskazany parametrem hba_file w usłudze danaco-nexus-postgres.
#
# TYPE  DATABASE     USER           METHOD
# Nextcloud (chmura osobista) łączy się własną rolą z hasłem zapisanym w jego config.php.
local   nextcloud    nextcloud      scram-sha-256
# Aplikacja Nexus i administracja: użytkownik systemowy usług (peer).
local   all          danaco-serwis  peer
local   replication  danaco-serwis  peer
