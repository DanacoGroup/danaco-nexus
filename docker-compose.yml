# Danaco Nexus – stos usług. Budowa obrazów: ./deploy/build.sh, uruchomienie: docker compose up -d
#
# Sieć: zapora hosta blokuje ruch wychodzący kontenerów w sieci mostkowej (FORWARD DROP),
# dlatego proces roboczy, który łączy się z API Claude i pobiera model osadzeń, działa
# w sieci hosta, a usługi pomocnicze są wystawione wyłącznie na pętli zwrotnej 127.0.0.1.
# API nie potrzebuje internetu i pozostaje w sieci wewnętrznej stosu.

name: danaco-nexus

x-common-environment: &common-environment
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Ustaw ANTHROPIC_API_KEY w pliku .env}
  NEXUS_ANTHROPIC_MODEL: ${NEXUS_ANTHROPIC_MODEL:-claude-opus-5}
  NEXUS_ANTHROPIC_EFFORT: ${NEXUS_ANTHROPIC_EFFORT:-}
  NEXUS_COOKIE_SECURE: ${NEXUS_COOKIE_SECURE:-true}
  NEXUS_WORKER_CONCURRENCY: ${NEXUS_WORKER_CONCURRENCY:-2}
  NEXUS_TOOL_THREADS: ${NEXUS_TOOL_THREADS:-8}
  NEXUS_UPLOAD_LIMIT_MB: ${NEXUS_UPLOAD_LIMIT_MB:-2048}
  NEXUS_REALESRGAN_DIR: /opt/realesrgan
  HOME: /tmp

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - ${NEXUS_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${NEXUS_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    volumes:
      - ${NEXUS_DATA_DIR:-./data}/qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:${NEXUS_QDRANT_PORT:-6335}:6333"

  tika:
    image: apache/tika:3.2.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXUS_TIKA_PORT:-9998}:9998"

  languagetool:
    image: erikvl87/languagetool:6.6
    restart: unless-stopped
    environment:
      Java_Xms: 256m
      Java_Xmx: 1g
    ports:
      - "127.0.0.1:${NEXUS_LANGUAGETOOL_PORT:-8010}:8010"

  api:
    image: danaco-nexus-api:latest
    pull_policy: never
    restart: unless-stopped
    user: "${NEXUS_UID:-1001}:${NEXUS_GID:-1001}"
    environment:
      <<: *common-environment
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      NEXUS_QDRANT_URL: http://qdrant:6333
    volumes:
      - ${NEXUS_DATA_DIR:-./data}/app:/data
    ports:
      - "127.0.0.1:${NEXUS_PORT:-8930}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: danaco-nexus-worker:latest
    pull_policy: never
    restart: unless-stopped
    user: "${NEXUS_UID:-1001}:${NEXUS_GID:-1001}"
    network_mode: host
    environment:
      <<: *common-environment
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD}@127.0.0.1:${NEXUS_POSTGRES_PORT:-5433}/nexus
      NEXUS_QDRANT_URL: http://127.0.0.1:${NEXUS_QDRANT_PORT:-6335}
      NEXUS_TIKA_URL: http://127.0.0.1:${NEXUS_TIKA_PORT:-9998}
      NEXUS_LANGUAGETOOL_URL: http://127.0.0.1:${NEXUS_LANGUAGETOOL_PORT:-8010}
    volumes:
      - ${NEXUS_DATA_DIR:-./data}/app:/data
      - ${NEXUS_REALESRGAN_HOST_DIR:-/danaco/programy/realesrgan}:/opt/realesrgan:ro
    stop_grace_period: 2m
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      tika:
        condition: service_started
      languagetool:
        condition: service_started
