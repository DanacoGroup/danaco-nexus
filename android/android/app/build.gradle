apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Klucz podpisu wydania: plik właściwości (storeFile, storePassword, keyAlias, keyPassword)
// wskazany parametrem -Pnexus.keystore=… (deploy/android/buduj-apk.sh). Bez niego wydanie jest niepodpisane.
def keystoreFile = project.findProperty('nexus.keystore')
def keystoreProps = new Properties()
if (keystoreFile != null && file(keystoreFile).isFile()) {
    file(keystoreFile).withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "pl.danaco.nexus"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.danaco.nexus"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "NEXUS_URL", '"https://danaco-nexus.pl"'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    lint {
        abortOnError = true
        checkReleaseBuilds = true
        warningsAsErrors = false
        lintConfig = file('lint.xml')
    }
    testOptions {
        unitTests.returnDefaultValues = true
        // Robolectric: testy okien i usług na JVM (zasoby, motywy, manifest).
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.offline', 'false'
            maxHeapSize = '2g'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.security:security-crypto:1.1.0"
    implementation "androidx.work:work-runtime-ktx:2.10.5"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    testImplementation "org.json:json:20250517"
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation "androidx.work:work-testing:2.10.5"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
